      +    mrr = _mean_or_none([r.reciprocal_rank for r in results])
           return {"recall": recall, "mrr": mrr}

  - id: review-clean-docstring
    verdict: approve
    defect_terms: []
    diff: |
      --- a/src/pagetrace/chunking.py
      +++ b/src/pagetrace/chunking.py
      @@ def chunk_page(text: str, size: int = 800, overlap: int = 120):
