  - id: review-clean-extract
    verdict: approve
    defect_terms: []
    diff: |
      --- a/src/pagetrace/evaluation.py
      +++ b/src/pagetrace/evaluation.py
      @@
      +def _mean_or_none(values: list[float]) -> float | None:
      +    return statistics.fmean(values) if values else None
      +
       def _aggregate(results):
      -    recall = statistics.fmean(r.recall for r in results) if results else None
      -    mrr = statistics.fmean(r.reciprocal_rank for r in results) if results else None
