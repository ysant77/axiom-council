# Code-review tasks with known answers. Pass = correct verdict, and for a rejection the
# findings name the planted defect (any one of defect_terms). Clean diffs test false alarms.
fixtures:
  - id: review-off-by-one
    verdict: reject
    defect_terms: [off-by-one, off by one, last page, final page, range, boundary, page_count]
    diff: |
      --- a/src/pagetrace/extraction.py
      +++ b/src/pagetrace/extraction.py
      @@ def page_texts(pdf):
      -    for index in range(len(pdf)):
      +    for index in range(len(pdf) - 1):
               page = pdf[index]
               yield index + 1, page.get_textpage().get_text_range()

