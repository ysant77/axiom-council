# Fixtures v1.1 (v1.1: widened one synonym group in plan-windows-node after auditing stored
# answers; results are reported under both versions).
# Product-manager planning tasks. Pass = valid plan JSON and every constraint check holds.
# Checks: milestone count bounds, hours budget, team models drawn only from the candidates,
# required roles staffed, required concepts mentioned (each group: any one term), forbidden
# phrases absent, and clarifying questions asked when the request is ambiguous.
fixtures:
