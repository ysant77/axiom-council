    request: >-
      Refactor PageTrace's evaluation module so no function exceeds 50 lines. Behaviour must
      not change. I can review for about 3 hours this week.
    candidates: [qwen3.8:27b, gemma4:26b, qwen3:4b]
    min_milestones: 2
    max_milestones: 5
    hours_budget: 12
    required_roles: [dev, qa]
    must_mention: [[test], [behaviour, behavior], [approv, review]]
    forbid: [push to main, skip tests, disable tests]
    expect_questions: false

  - id: plan-video-explainer
    request: make me a video that explains a paper from my reading list, something cool
    candidates: [qwen3.8:27b, gemma4:26b, qwen3:4b]
    min_milestones: 2
    max_milestones: 6
    hours_budget: 40
    required_roles: [design, dev]
    must_mention: [[speech, tts, voice, narrat], [render, video, animation, frames], [capabilit, missing, gap, tool]]
    forbid: []
    expect_questions: true

