[project]
name = "axiom-council"
version = "0.1.0"
description = "Policy-gated, evaluated council of open-weight models with cost-aware routing."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Yatharth Mahesh Sant", email = "ysant77@gmail.com" }]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.8",
    "pyyaml>=6.0",
]

[project.scripts]
council = "axiom_council.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/axiom_council"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PT011", "PT018"]

[tool.mypy]
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q --cov=axiom_council --cov-branch --cov-report=term-missing --cov-fail-under=85 -m \"not live\""
testpaths = ["tests"]
markers = ["live: needs a running local model server (deselected in CI)"]
