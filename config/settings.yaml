# Tunable settings. Changing a value here (or in the config store) is a new config version;
# no code change is needed. Each entry's `name` selects a typed section in settings.py.
settings:
  - name: router
    prior_strength: 10.0   # pseudo-observations behind a model card's prior_skill
    default_prior: 0.5     # prior for task classes a card does not list
    conservatism_sd: 1.0   # skill gate = posterior mean minus this many s.d.
    min_success: 0.55      # skill gate threshold
    max_seconds: null      # optional latency ceiling per task
    match_harness: false   # true: ignore evidence from other harness versions (RFC 0005)

  - name: bakeoff
    num_ctx: 16384
    temperature: 0.3
    seed: null             # set an integer for seeded sampling; recorded in every result
    sandbox_id: pagetrace
    repair_attempts: 0     # extra attempts after feedback; `council bakeoff --repair N` overrides
    # public_checks: rules the prompt itself states, so their failures may be fed back.
    # Every other check is the hidden rubric and is never revealed to the model.
    kinds:
      plan:
        prompt_id: dispatcher.plan
        task_class: plan
        num_predict: 4000
        public_checks: [valid_json, within_hours, models_from_candidates]
      review:
        prompt_id: reviewer.review
        task_class: review
        num_predict: 2500
        public_checks: [valid_json]
      code:
        prompt_id: builder.refactor
        task_class: code_patch
        num_predict: 8000
        public_checks: [splice, edit_policy, lint, tests]

  # M4 pipeline: each graph node acts as one role and exercises one capability; the policy
  # engine checks both before the node runs. A node missing here cannot be added to a graph.
  - name: pipeline
    approval_action: apply_patch
    max_build_attempts: 2
    # true: the critic returns a JSON array of findings; code drops the ones it cannot resolve
    # in the patch or in a failed gate check, and every supported high finding needs an answer.
    # false: the critic returns only a verdict (critic_approves), as before.
    gated_findings: true
    max_findings: 50       # critic output with more findings is malformed and blocks approval
    nodes:
      plan: {role: dispatcher, capability: llm_inference}
      build: {role: builder, capability: propose_patch}
      gate: {role: gatekeeper, capability: run_sandbox}
      critique: {role: reviewer, capability: llm_inference}

  # Energy measurement and carbon accounting. The grid factor is the average grid emission
  # factor (GEF) for 2024 published by EMA, Singapore Energy Statistics chapter 2
  # (https://ema.gov.sg/resources/singapore-energy-statistics/chapter2). Update when EMA
  # publishes a newer year; reports must cite the year used.
  - name: energy
    sample_interval_s: 0.5
    grid_kg_co2e_per_kwh: 0.402
    grid_factor_source: "EMA Singapore Energy Statistics, average GEF 2024"
