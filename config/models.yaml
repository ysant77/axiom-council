    context_tokens: 131072
    modalities: [text, image]
    tool_calling: false
    memory_gb: 4.0
    shadow_usd_per_mtok: 0.10
    prior_skill:
      triage: 0.7
      extract: 0.65
      grounded_answer: 0.55
      plan: 0.45
      review: 0.5
      draft: 0.6
      code_patch: 0.3

  - model_id: qwen3.8:27b
    family: qwen3.8
    licence: Apache-2.0
    params_b: 27
    context_tokens: 262144
    tool_calling: true
    memory_gb: 18
