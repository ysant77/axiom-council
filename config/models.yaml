    family: gpt-oss
    licence: Apache-2.0
    params_b: 21
    active_params_b: 3.6
    context_tokens: 131072
    tool_calling: true
    memory_gb: 14
    shadow_usd_per_mtok: 0.30
    reasoning_overhead_tokens: 400
    request_defaults: {reasoning_effort: low}
    prior_skill:
      triage: 0.8
