# Role grants. A role can never exceed these, whatever a task or a model asks for.
roles:
  - name: dispatcher
    description: Decomposes tasks, picks among router-eligible models, answers worker questions.
    capabilities: [llm_inference, read_workspace, read_evidence]
    can_ask: [director]

  - name: worker
    description: Executes one bounded sub-task with the evidence it is handed.
    capabilities: [llm_inference, read_evidence]
    can_ask: [dispatcher]

  - name: reviewer
    description: Checks a result against acceptance checks and sources; cannot edit it.
    capabilities: [llm_inference, read_evidence, read_workspace]
    can_ask: [dispatcher, director]

  - name: builder
    description: Proposes whole-file edits; never runs code (the gatekeeper does).
    capabilities: [llm_inference, read_workspace, propose_patch]
    can_ask: [dispatcher]

  - name: gatekeeper
    description: Deterministic council code; applies edits in the sandbox and runs allowlisted checks.
    capabilities: [read_workspace, run_sandbox]
    can_ask: [director]
